{% extends 'layout/base.html' %}
{% block content %}

<div class="container mt-5 vh-100">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0" style="border-radius: 15px;">
                <div class="card-body text-center p-5">
                    
                    <img src="{{ current_user.avatar }}" alt="Avatar" class="rounded-circle img-thumbnail shadow-sm mb-4" style="width: 150px; height: 150px; object-fit: cover;">
                    
                    <h3 class="fw-bold text-primary mb-1">{{ current_user.name }}</h3>
                    <p class="text-muted mb-4">
                        <span class="badge bg-info text-dark px-3 py-2 rounded-pill">

                        </span>
                    </p>
                    
                    <ul class="list-group list-group-flush text-start mb-4">
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                            <span class="text-muted"><i class="fas fa-user me-2"></i>Tên đăng nhập</span>
                            <span class="fw-bold">{{ current_user.username }}</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                            <span class="text-muted"><i class="fas fa-id-card me-2"></i>Mã số User (ID)</span>
                            <span class="fw-bold">SV-2026-{{ current_user.id }}</span>
                        </li>
                    </ul>
                    
                    <div class="d-grid gap-2">
                        <a href="/" class="btn btn-outline-primary fw-bold">Trở về Trang chủ</a>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
