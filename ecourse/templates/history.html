{% extends 'layout/base.html' %}

{% block content %}
<div class="mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
        <h4 class="text-info m-0">LỊCH SỬ ĐĂNG KÝ CỦA TÔI</h4>
        <a href="/" class="btn btn-outline-secondary btn-sm">Quay lại trang chủ</a>
    </div>

    <table class="table table-bordered table-striped shadow-sm mt-3">
        <thead class="table-info text-center">
            <tr>
                <th>Mã Đăng ký</th>
                <th>Môn học</th>
                <th>Ngày đăng ký</th>
            </tr>
        </thead>
        <tbody>
            {% for h in history %}
            <tr class="text-center align-middle">
                <td>{{ h.id }}</td>
                <td>{{ h.lop_hoc_phan.mon_hoc.name }}</td>
                <td>{{ h.ngay_dang_ky }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="text-center text-muted py-3">
                    Bạn chưa đăng ký môn học nào.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
