{% extends 'layout/base.html' %}

{% block content %}

{% if pages > 1 %}
<ul class="pagination mt-3 justify-content-center">
    {% for i in range(1, pages+1) %}
    <li class="page-item"><a class="page-link" href="/?page={{i}}">{{i}}</a></li>
    {% endfor %}
</ul>
{% endif %}

<div class="row mt-4">
    {% for kh in courses %}
    <div class="col-md-3 col-12" style="padding:0.7rem">
        <div class="card h-100 shadow-sm">
            <img class="card-img-top" src="{{ kh.image }}" alt="{{ kh.name }}">
            <div class="card-body d-flex flex-column">
                <h4 class="card-title">{{ kh.name }}</h4>
                <p class="card-text text-danger font-weight-bold">{{"{:,.0f}".format(kh.price)}} VND</p>

                <div class="mt-auto">
                    <a href="/courses/{{ kh.id }}" class="btn btn-outline-info w-100 mb-2">Xem chi tiết</a>

                    <a href="javascript:;" class="btn btn-primary w-100"
                       onclick="themKhoaHoc({{ kh.id }}, '{{ kh.name }}', {{ kh.price }})">Chọn đăng ký</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
